function sync(){const a=S.ans[S.i]||{};document.querySelectorAll('.opt').forEach(o=>{const on=o.dataset.v==a.pick;o.classList.toggle('on',on);o.setAttribute('aria-pressed',on)});const n=$('[data-a=next]');if(n)n.disabled=!(a.pick||(a.text||'').trim())}
V.home=()=>`<section class="hero"><div><span class="pill">🔍 Your personal AI personality detective</span><h1>You don't know your MBTI? <span class="gt">Let AI discover it.</span></h1><p class="sub">Answer a few questions. Share your thoughts. Let our AI detective uncover your personality.</p><div class="row"><button class="btn" data-a="start">Discover My Personality</button><small>No MBTI knowledge required.</small></div></div>
<div class="art"><svg viewBox="0 0 320 320" role="img" aria-label="Friendly detective with a magnifying glass"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cf6"/><stop offset="1" stop-color="#f58fc2"/></linearGradient></defs><circle cx="160" cy="160" r="144" fill="url(#g1)" opacity=".2"/><circle cx="160" cy="178" r="62" fill="#ffe0cf"/><ellipse cx="160" cy="130" rx="86" ry="15" fill="#4a3f7a"/><path d="M116 128c0-42 20-64 44-64s44 22 44 64z" fill="#5f509c"/><rect x="116" y="108" width="88" height="11" fill="#f58fc2"/><circle cx="140" cy="172" r="5" fill="#2a2540"/><circle cx="180" cy="172" r="5" fill="#2a2540"/><path d="M142 194q18 14 36 0" stroke="#2a2540" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="238" cy="208" r="40" fill="rgba(255,255,255,.55)" stroke="#8b7cf6" stroke-width="9"/><line x1="266" y1="237" x2="296" y2="272" stroke="#8b7cf6" stroke-width="13" stroke-linecap="round"/><text x="238" y="224" font-size="44" font-weight="700" text-anchor="middle" fill="#8b7cf6">?</text></svg>
<span class="fl" style="top:6%;left:4%">✦</span><span class="fl" style="top:12%;right:2%;animation-delay:1s">🧩</span><span class="fl" style="bottom:6%;left:0;animation-delay:2s">💭</span></div></section>
<h2 class="sec">How it works</h2><div class="grid">${[['01','Answer','Answer natural questions about everyday situations.'],['02','AI Analysis','Our AI analyzes your answers using natural language processing.'],['03','Discover','Receive your estimated MBTI type and a personalized personality profile.']].map(([n,t,d])=>`<div class="card step"><b class="gt">${n}</b><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>`;
V.quiz=()=>{const q=Q[S.i],a=S.ans[S.i]||{},last=S.i==Q.length-1;
return`<div class="card quiz"><div class="prog"><span>Question ${S.i+1} / ${Q.length}</span><div class="bar"><i style="--w:${S.i/Q.length*100}%"></i></div></div><h2>${q[0]}</h2>${[[q[1],q[2]],[q[3],q[4]]].map(([l,t])=>`<button class="opt" data-a="pick" data-v="${l}">${t}</button>`).join('')}<p class="or"><small>Or answer in your own words (optional)</small></p><textarea id="tx" maxlength="280" aria-label="Your own answer" placeholder="Write a short answer…">${esc(a.text||'')}</textarea><div class="nav2"><button class="ghost" data-a="back" ${S.i?'':'disabled'}>← Back</button><button class="btn" data-a="next">${last?'Reveal my type ✨':'Next →'}</button></div></div>`};
V.analyze=()=>`<div class="card an"><div class="spin"></div><h2 aria-live="polite">AI analyzing your personality…</h2><ul>${['Analyzing your answers…','Detecting personality patterns…','Comparing personality profiles…','Finding your closest MBTI type…'].map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
V.result=()=>{const r=S.r,t=TY[r.type];return`<section class="card res"><p class="sub">Your personality type is…</p><div class="big gt">${r.type}</div><h2>${t.n}</h2><p class="sub">${t.d}</p><div class="ring" style="--p:${r.match}"><div><b>${r.match}%</b><small>Estimated match</small></div></div></section>
<h2 class="sec">Your four signals</h2><div class="grid">${r.dims.map((d,i)=>`<button class="card dim" data-a="tog" aria-expanded="false"><small>${DN[i]}</small><span>${d.pct}%</span><b>${d.l}</b><div class="bar"><i style="--w:${d.pct}%"></i></div><p class="det">You seem to ${PH[d.l]}. Tap again to close.</p></button>`).join('')}</div>
<h2 class="sec">How sure is the AI?</h2><div class="card">${r.top.map(([c,p])=>`<button class="row2" data-a="open" data-v="${c}"><b>${c}<small>${TY[c].n}</small></b><div class="bar"><i style="--w:${p}%"></i></div><span>${p}%</span></button>`).join('')}<small>The AI shows its top three guesses, because no estimate is ever 100% certain.</small></div>
<h2 class="sec">Why does our AI think you're an ${r.type}?</h2><div class="card">${why(r)}</div>
${chars(r.type)}<h2 class="sec">Your personality profile</h2><div class="grid">${prof(r.type).map(([i,n,x])=>`<div class="card"><h3>${i} ${n}</h3><p>${x}</p></div>`).join('')}</div>
<div class="row" style="justify-content:center;margin-top:2rem"><button class="btn" data-a="go" data-v="explore">Explore all 16 types</button><button class="ghost" data-a="start">Retake the test</button></div>`};
V.explore=()=>`<h2 class="sec" style="margin-top:1rem">Explore the 16 types</h2><p class="sub">Tap a card to open the full profile.</p><div class="grid">${Object.entries(TY).map(([c,t])=>`<button class="card tcard" style="--k:${GC[grp(c)]}" data-a="open" data-v="${c}"><span class="code">${c}</span><h3>${t.n}</h3><p>${t.d}</p><div class="tags">${t.t.map(x=>`<span>${x}</span>`).join('')}</div><p style="margin:.7rem 0 0"><small>🎭 ${cn(c)}</small></p></button>`).join('')}</div>`;
V.about=()=>`<h2 class="sec" style="margin-top:1rem">How does MBTI Detective AI work?</h2><p class="sub">Your answers travel through a simple pipeline, and every step is designed to be explainable.</p><div class="pipe">${['User answers','Natural Language Processing','Feature extraction','Machine Learning model','Personality classification','MBTI prediction'].map(t=>`<div class="card">${t}</div>`).join('')}</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Choosing the best model</h3><p>The system can train several classifiers (Logistic Regression, SVM, Random Forest and a Neural Network) on TF-IDF or embedding features, compare them with cross-validation, and keep the best performer as the live model.</p></div><div class="card"><h3>Transparent by design</h3><p>You always see the top three predicted types with their probabilities, not a single confident label. This live preview uses a built-in sample scorer in your browser, and a trained model plugs in through one predict() call.</p></div></div>`;
const act={go:v=>go(v),start(){S.i=0;S.ans=[];go('quiz')},
pick(v){S.ans[S.i]={...(S.ans[S.i]||{}),pick:v};sync()},
back(){S.i--;go('quiz')},next(){S.i<Q.length-1?(S.i++,go('quiz')):analyze()},
tog(v,b){const o=b.classList.toggle('open');b.setAttribute('aria-expanded',o)},
open:v=>modal(v),
close(v,b,e){if(e&&b.classList.contains('modal')&&e.target!==b)return;$('.modal')?.remove()},
theme(){const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark';r.dataset.theme=d?'light':'dark'}};
async function analyze(){go('analyze');const L=[...app.querySelectorAll('li')];
 try{const p=predict(S.ans);for(const li of L){li.className='on';await sleep(950);li.className='done'}S.r=await p;S.res=local(S.ans).res;go('result')}
 catch(e){app.innerHTML='<div class="view card an"><h2>Something went wrong</h2><p>The analysis could not finish. Check your connection and try again.</p><button class="btn" data-a="next">Try again</button></div>'}}
function modal(c){const t=TY[c],k=GC[grp(c)],m=document.createElement('div');m.className='modal';m.dataset.a='close';
 m.innerHTML=`<div class="card sheet" role="dialog" aria-modal="true" aria-label="${t.n}"><button class="ghost" data-a="close" style="float:right" aria-label="Close">✕</button><div class="big" style="color:${k};font-size:3.4rem">${c}</div><h2>${t.n}</h2><p class="sub">${t.d}</p><div class="tags">${t.t.map(x=>`<span>${x}</span>`).join('')}</div><h3 style="margin:1.1rem 0 .2rem">🎭 Characters fans give this type</h3>${chr(c)}${prof(c).map(([i,n,x])=>`<h3 style="margin:1.1rem 0 .2rem">${i} ${n}</h3><p style="margin:0">${x}</p>`).join('')}</div>`;
 document.body.append(m);m.querySelector('button').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a]?.(b.dataset.v,b,e)});
document.addEventListener('input',e=>{if(e.target.id=='tx'){(S.ans[S.i]=S.ans[S.i]||{}).text=e.target.value;sync()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')act.close()});
go('home');
</script></body></html>
